name: "회귀 검증 / Regression / 回归 / Regresión"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: kernel_control_panel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: "의존성 / Dependencies / 依赖 / Dependencias"
        run: python -m pip install -r requirements.txt
      - name: "DIA 도구 준비 / Prepare DIA helper / 准备 DIA 工具 / Preparar DIA"
        run: |
          $vsLocator = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vsLocator -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'Visual Studio 2022 C++ tools unavailable' }
          $vsCompat = 'C:\Program Files\Microsoft Visual Studio\2022\Professional'
          if (-not (Test-Path -LiteralPath $vsCompat)) {
            New-Item -ItemType Junction -Path $vsCompat -Target $vsInstall | Out-Null
          }
          if (-not (Test-Path -LiteralPath "$vsCompat\DIA SDK\bin\amd64\msdia140.dll")) { throw 'DIA SDK unavailable' }
          Push-Location native
          try {
            & .\build_pdb_symbols.cmd
            if ($LASTEXITCODE -ne 0) { throw 'DIA helper build failed' }
          } finally { Pop-Location }
      - name: "모의 회귀 시험 / Mocked regressions / 模拟回归 / Regresiones simuladas"
        # Build only; no DLL loading / 빌드만 / 仅构建 / Solo compilar
        run: |
          & ../samples/build_fixture.ps1
          python -m unittest discover -p 'test*.py' -v
# No driver loading / 드라이버 로드 없음 / 不加载驱动 / Sin carga del controlador
