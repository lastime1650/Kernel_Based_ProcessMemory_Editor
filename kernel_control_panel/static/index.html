<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SampleKernel1 · Kernel Studio</title><link rel="stylesheet" href="/static/studio.css"><link rel="stylesheet" href="/static/function_views.css"><link rel="stylesheet" href="/static/disassembly_workspace.css"><link rel="stylesheet" href="/static/scan_workspace.css"><link rel="stylesheet" href="/static/memory_editor.css"><link rel="stylesheet" href="/static/productivity_suite.css"><link rel="stylesheet" href="/static/memory_wide_view.css"><link rel="stylesheet" href="/static/memory_allocation.css?v=20261005"></head>
<body><aside class="sidebar"><div class="brand"><span class="mark">K</span><div>Kernel Studio<small>SampleKernel1 작업 공간</small></div></div><button id="choose-process" class="target-button">대상 프로세스 선택 <span>↗</span></button><div id="target-summary" class="target-summary">선택된 프로세스 없음</div><input id="tool-search" aria-label="도구 찾기" placeholder="도구 찾기 · Ctrl K" autocomplete="off"><nav id="navigation" aria-label="도구 메뉴"></nav><div class="sidebar-bottom"><span id="connection-dot" class="dot"></span><span id="connection-text">연결 확인 중</span><small>외부 CDN 없이 로컬 실행</small></div></aside>
<div class="shell"><header><div><span class="eyebrow" id="breadcrumb">WORKSPACE</span><h1 id="page-title">대시보드</h1></div><div class="global-fields"><label>현재 주소<input id="global-address" placeholder="0x00000000" autocomplete="off"></label><label>스레드 TID<input id="global-tid" placeholder="TID" inputmode="numeric"></label><button id="refresh-page" class="secondary">새로 고침</button></div></header><main id="main-content"></main><footer><span id="footer-status">도구를 선택해 작업을 시작하세요</span><span>주소와 64비트 값은 정밀도를 유지합니다</span></footer></div>
<dialog id="process-dialog"><div class="dialog-head"><h2>대상 프로세스 선택</h2><button id="close-process" class="secondary">닫기</button></div><p>실행 중인 프로세스를 커널로 조회합니다. 목록에서 선택하거나 PID를 직접 입력하세요.</p><div class="actions"><label>PID 조회 범위<select id="process-range" aria-label="PID 조회 범위"><option value="65536">4 ~ 65,536</option><option value="262144">4 ~ 262,144</option><option value="1048576">4 ~ 1,048,576</option></select></label><button id="refresh-processes" class="secondary">목록 새로 고침</button><input id="manual-pid" aria-label="조회할 PID" placeholder="PID 입력" inputmode="numeric"><button id="identify-target">대상 확인 / 선택</button></div><p id="process-status" class="subtle" role="status" aria-live="polite"></p><input id="process-search" aria-label="프로세스 검색" placeholder="프로세스 이름 또는 PID 검색"><div id="process-list"></div></dialog><div id="toast" role="status" aria-live="polite"></div><input type="file" id="workspace-file" accept=".json" hidden><input type="file" id="binary-file" accept=".bin,.dat" hidden><script src="/static/function_views.js"></script><script src="/static/disassembly_workspace.js"></script><script src="/static/dll_workspace.js"></script><script src="/static/scan_workspace.js"></script><script src="/static/memory_editor.js?v=20261005-wheel"></script><script src="/static/productivity_suite.js"></script><script src="/static/memory_wide_view.js?v=20261005-beta"></script><script src="/static/memory_allocation.js?v=20261005"></script><script type="module" src="/static/studio.js?v=20261005-allocation"></script></body></html>
